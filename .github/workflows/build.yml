name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disk-inventory-zed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test release integrity tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_release_integrity.py'

      - name: Validate tagged release source
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            exit 0
          fi
          VERSION="$(python3 - <<'PY'
          import os
          import plistlib
          import re
          import xml.etree.ElementTree as ET

          with open("Resources/Info.plist", "rb") as source:
              mac_version = plistlib.load(source)["CFBundleShortVersionString"]
          windows_properties = ET.parse("Windows/Directory.Build.props")
          windows_version = windows_properties.findtext(".//Version")
          assembly_version = windows_properties.findtext(".//AssemblyVersion")
          file_version = windows_properties.findtext(".//FileVersion")
          windows_manifest = ET.parse(
              "Windows/src/DiskInventoryZed.Windows/app.manifest"
          ).getroot()
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", mac_version):
              raise SystemExit(f"Invalid application version: {mac_version!r}")
          if windows_version != mac_version:
              raise SystemExit(
                  f"Version mismatch: macOS={mac_version!r}, Windows={windows_version!r}"
              )
          if assembly_version != "$(Version).0" or file_version != "$(Version).0":
              raise SystemExit(
                  "Windows assembly and file versions must derive from the product version"
              )
          manifest_identity = next(
              element for element in windows_manifest
              if element.tag.endswith("assemblyIdentity")
          )
          if manifest_identity.get("version") != f"{mac_version}.0":
              raise SystemExit("Windows manifest and product versions do not match")
          expected_tag = f"v{mac_version}"
          if os.environ["GITHUB_REF_NAME"] != expected_tag:
              raise SystemExit(
                  f"Release tag {os.environ['GITHUB_REF_NAME']!r} must equal {expected_tag!r}"
              )
          print(mac_version)
          PY
          )"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo "Release tag $GITHUB_REF_NAME is not on origin/main." >&2
            exit 1
          }
          for environment in release-signing release-publish; do
            ENVIRONMENT_JSON="$RUNNER_TEMP/$environment.json"
            POLICIES_JSON="$RUNNER_TEMP/$environment-policies.json"
            gh api "repos/$GITHUB_REPOSITORY/environments/$environment" > "$ENVIRONMENT_JSON" || {
              echo "The protected $environment environment must exist before creating a production tag." >&2
              exit 1
            }
            gh api "repos/$GITHUB_REPOSITORY/environments/$environment/deployment-branch-policies?per_page=100" > "$POLICIES_JSON"
            python3 - "$ENVIRONMENT_JSON" "$POLICIES_JSON" "$environment" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              environment = json.load(source)
          with open(sys.argv[2], encoding="utf-8") as source:
              policies = json.load(source)
          reviewer_rules = [
              rule for rule in environment.get("protection_rules", [])
              if rule.get("type") == "required_reviewers" and rule.get("reviewers")
          ]
          if not reviewer_rules:
              raise SystemExit(
                  f"The {sys.argv[3]} environment must require at least one reviewer."
              )
          if not any(rule.get("prevent_self_review") is True for rule in reviewer_rules):
              raise SystemExit(
                  f"The {sys.argv[3]} environment must prevent self-review."
              )
          if environment.get("can_admins_bypass") is not False:
              raise SystemExit(
                  f"The {sys.argv[3]} environment must disable administrator bypass."
              )
          branch_policy = environment.get("deployment_branch_policy") or {}
          if (branch_policy.get("protected_branches") is not False or
                  branch_policy.get("custom_branch_policies") is not True):
              raise SystemExit(
                  f"The {sys.argv[3]} environment must use custom deployment policies."
              )
          tag_policies = {
              (policy.get("name"), policy.get("type"))
              for policy in policies.get("branch_policies", [])
          }
          if tag_policies != {("v*", "tag")}:
              raise SystemExit(
                  f"The {sys.argv[3]} environment must have exactly one v* tag policy."
              )
          PY
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: macos-15
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run unit tests
        run: swift test

      - name: Build debug with concurrency diagnostics
        run: swift build -Xswiftc -strict-concurrency=complete

      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64

      - name: Package and verify app bundle
        run: SIGNING_IDENTITY="-" ./scripts/package-app.sh

      - name: Create DMG
        run: |
          ./scripts/create-dmg.sh

      - name: Archive app bundle artifact
        run: ditto -c -k --sequesterRsrc --keepParent DiskInventoryZed.app DiskInventoryZed.app.zip

      - name: Generate release checksums
        run: shasum -a 256 DiskInventoryZed-*.dmg > DiskInventoryZed-checksums.txt

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DiskInventoryZed-DMG-CI
          path: |
            DiskInventoryZed-*.dmg
            DiskInventoryZed-checksums.txt
          if-no-files-found: error
          overwrite: true

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DiskInventoryZed-App-CI
          path: DiskInventoryZed.app.zip
          if-no-files-found: error
          overwrite: true

  macos-signing:
    needs: [validate, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 30
    environment: release-signing
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Checkout trusted release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate Apple signing configuration
        env:
          SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for value in \
            "$SIGNING_CERTIFICATE" \
            "$SIGNING_CERTIFICATE_PASSWORD" \
            "$KEYCHAIN_PASSWORD" \
            "$SIGNING_IDENTITY" \
            "$APPLE_ID" \
            "$APPLE_TEAM_ID" \
            "$APPLE_APP_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "Tagged releases require complete Apple signing and notarization credentials." >&2
              exit 1
            fi
          done

      - name: Build universal release binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Install Apple signing certificate
        env:
          SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/DiskInventoryZed-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/DiskInventoryZed-signing.keychain-db"
          printf '%s' "$SIGNING_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$SIGNING_IDENTITY"

      - name: Sign and verify app bundle
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ./scripts/package-app.sh
          codesign --verify --deep --strict --verbose=4 DiskInventoryZed.app
          SIGNING_DETAILS="$(codesign -dv --verbose=4 DiskInventoryZed.app 2>&1)"
          grep -F "Authority=$SIGNING_IDENTITY" <<< "$SIGNING_DETAILS"
          grep -F "TeamIdentifier=$EXPECTED_TEAM_ID" <<< "$SIGNING_DETAILS"

      - name: Create, notarize, and assess DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ./scripts/create-dmg.sh
          ./scripts/notarize.sh DiskInventoryZed-*.dmg
          hdiutil verify DiskInventoryZed-*.dmg
          spctl --assess --type open --context context:primary-signature --verbose=4 DiskInventoryZed-*.dmg

      - name: Generate signed release checksum
        run: shasum -a 256 DiskInventoryZed-*.dmg > DiskInventoryZed-checksums.txt

      - name: Attest signed DMG provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: DiskInventoryZed-checksums.txt

      - name: Upload signed DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DiskInventoryZed-DMG
          path: |
            DiskInventoryZed-*.dmg
            DiskInventoryZed-checksums.txt
          if-no-files-found: error
          overwrite: false

      - name: Remove Apple signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/DiskInventoryZed-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/DiskInventoryZed-signing.p12"

  windows:
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore Windows solution
        shell: pwsh
        run: dotnet restore Windows/DiskInventoryZed.Windows.sln --locked-mode

      - name: Run Windows reliability tests with coverage
        shell: pwsh
        run: |
          $projects = @(
            @{
              Name = "Core"
              Path = "Windows/tests/DiskInventoryZed.Core.Tests/DiskInventoryZed.Core.Tests.csproj"
            },
            @{
              Name = "Windows"
              Path = "Windows/tests/DiskInventoryZed.Windows.Tests/DiskInventoryZed.Windows.Tests.csproj"
            }
          )
          foreach ($project in $projects) {
            dotnet test $project.Path `
              -c Release `
              --no-restore `
              --settings Windows/coverage.runsettings `
              --collect "Code Coverage" `
              --blame-hang-timeout 2m `
              --logger "trx;LogFileName=$($project.Name).trx" `
              --results-directory "artifacts/test-results/$($project.Name)"
            if ($LASTEXITCODE -ne 0) {
              throw "$($project.Name) tests failed."
            }
          }

      - name: Validate Windows test and coverage reports
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          foreach ($suite in @("Core", "Windows")) {
            $resultRoot = "artifacts/test-results/$suite"
            $trxReport = Get-ChildItem $resultRoot -Recurse -Filter "$suite.trx" |
                Select-Object -First 1
            if ($null -eq $trxReport) {
              throw "$suite did not produce a TRX report."
            }

            [xml]$testResults = Get-Content $trxReport.FullName -Raw
            $counters = $testResults.TestRun.ResultSummary.Counters
            if ($null -eq $counters -or
                [int]$counters.total -le 0 -or
                [int]$counters.failed -ne 0 -or
                [int]$counters.executed -ne [int]$counters.total -or
                [int]$counters.passed -ne [int]$counters.total) {
              throw "$suite has failed, skipped, or not-executed tests."
            }

            $coverageReport = Get-ChildItem $resultRoot -Recurse -Filter *.cobertura.xml |
                Select-Object -First 1
            if ($null -eq $coverageReport) {
              throw "$suite did not produce a Cobertura report."
            }

            [xml]$coverage = Get-Content $coverageReport.FullName -Raw
            $linesValid = [int]$coverage.coverage.GetAttribute("lines-valid")
            if ($linesValid -eq 0) {
              throw "$suite coverage contains no owned production lines."
            }
            $unexpectedPackages = @(
              $coverage.coverage.packages.package |
                  ForEach-Object { $_.GetAttribute("name") } |
                  Where-Object { $_ -notin @("DiskInventoryZed", "DiskInventoryZed.Core", "DiskInventoryZed.Windows") }
            )
            if ($unexpectedPackages.Count -ne 0) {
              throw "$suite coverage contains unexpected packages: $($unexpectedPackages -join ', ')"
            }
            $requiredPackage = if ($suite -eq "Core") { "DiskInventoryZed.Core" } else { "DiskInventoryZed" }
            $requiredPackageNode = $coverage.coverage.packages.package |
                Where-Object { $_.GetAttribute("name") -eq $requiredPackage } |
                Select-Object -First 1
            if ($null -eq $requiredPackageNode) {
              throw "$suite coverage does not contain required package $requiredPackage."
            }

            $rawLineRate = [double]$requiredPackageNode.GetAttribute("line-rate")
            $rawBranchRate = [double]$requiredPackageNode.GetAttribute("branch-rate")
            if ([double]::IsNaN($rawLineRate) -or [double]::IsInfinity($rawLineRate) -or
                [double]::IsNaN($rawBranchRate) -or [double]::IsInfinity($rawBranchRate) -or
                $rawLineRate -lt 0 -or $rawLineRate -gt 1 -or
                $rawBranchRate -lt 0 -or $rawBranchRate -gt 1) {
              throw "$suite coverage contains invalid rates for $requiredPackage."
            }
            $lineRate = [math]::Round(100 * $rawLineRate, 1)
            $branchRate = [math]::Round(100 * $rawBranchRate, 1)
            if ($suite -eq "Core" -and ($rawLineRate -lt 0.65 -or $rawBranchRate -lt 0.60)) {
              throw "Core coverage regressed below 65% line / 60% branch: $lineRate% / $branchRate%."
            }
            if ($suite -eq "Windows" -and ($rawLineRate -lt 0.10 -or $rawBranchRate -lt 0.05)) {
              throw "Windows coverage regressed below 10% line / 5% branch: $lineRate% / $branchRate%."
            }
            $skipped = [int]$counters.total - [int]$counters.passed - [int]$counters.failed
            @(
              "### $suite tests ($env:RUNNER_ARCH)"
              ""
              "| Total | Passed | Failed | Skipped/not executed | Line coverage | Branch coverage |"
              "| ---: | ---: | ---: | ---: | ---: | ---: |"
              "| $($counters.total) | $($counters.passed) | $($counters.failed) | $skipped | $lineRate% | $branchRate% |"
              ""
            ) | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload Windows test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DiskInventoryZed-Windows-TestReports-${{ runner.arch }}
          path: artifacts/test-results/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Build Windows desktop application
        shell: pwsh
        run: dotnet build Windows/src/DiskInventoryZed.Windows/DiskInventoryZed.Windows.csproj -c Release --no-restore

      - name: Create ephemeral CI code-signing certificate
        id: ci-signing
        shell: pwsh
        timeout-minutes: 2
        run: |
          $subject = "CN=Disk Inventory Zed CI"
          $certificateDirectory = Join-Path $env:RUNNER_TEMP "DiskInventoryZed-ci-signing"
          $keyPath = Join-Path $certificateDirectory "signing.key"
          $certificateFilePath = Join-Path $certificateDirectory "signing.cer"
          $pfxPath = Join-Path $certificateDirectory "signing.pfx"
          $passwordBytes = [byte[]]::new(32)
          [Security.Cryptography.RandomNumberGenerator]::Fill($passwordBytes)
          $password = [Convert]::ToBase64String($passwordBytes)
          $certificate = $null
          $publicCertificate = $null
          $installationComplete = $false
          New-Item $certificateDirectory -ItemType Directory -Force | Out-Null
          try {
            $openssl = (Get-Command openssl.exe -ErrorAction Stop).Source
            Write-Host "Generating the ephemeral CI signing key."
            & $openssl req -x509 -newkey rsa:2048 -sha256 `
              -keyout $keyPath `
              -out $certificateFilePath `
              -days 2 `
              -subj "/CN=Disk Inventory Zed CI" `
              -passout "pass:$password" `
              -addext "basicConstraints=critical,CA:FALSE" `
              -addext "keyUsage=critical,digitalSignature" `
              -addext "extendedKeyUsage=codeSigning"
            if ($LASTEXITCODE -ne 0) {
              throw "OpenSSL failed to create the CI signing certificate."
            }

            & $openssl pkcs12 -export `
              -inkey $keyPath `
              -in $certificateFilePath `
              -out $pfxPath `
              -name "Disk Inventory Zed CI" `
              -passin "pass:$password" `
              -passout "pass:$password"
            if ($LASTEXITCODE -ne 0) {
              throw "OpenSSL failed to package the CI signing certificate."
            }

            Write-Host "Loading the ephemeral key into the user certificate store."
            $keyStorageFlags = (
              [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::UserKeySet -bor
              [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet
            )
            $certificate = [Security.Cryptography.X509Certificates.X509CertificateLoader]::LoadPkcs12(
              [IO.File]::ReadAllBytes($pfxPath),
              $password,
              $keyStorageFlags,
              $null)
            if (-not $certificate.HasPrivateKey -or $certificate.Subject -cne $subject) {
              throw "The generated CI signing certificate is invalid."
            }
            $publicCertificate = [Security.Cryptography.X509Certificates.X509CertificateLoader]::LoadCertificate(
              $certificate.RawData)

            foreach ($storeName in @(
              [Security.Cryptography.X509Certificates.StoreName]::My,
              [Security.Cryptography.X509Certificates.StoreName]::Root,
              [Security.Cryptography.X509Certificates.StoreName]::TrustedPublisher
            )) {
              Write-Host "Adding the ephemeral certificate to CurrentUser/$storeName."
              $store = [Security.Cryptography.X509Certificates.X509Store]::new(
                $storeName,
                [Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser)
              $storeCertificate = $publicCertificate
              if ($storeName -eq [Security.Cryptography.X509Certificates.StoreName]::My) {
                $storeCertificate = $certificate
              }
              try {
                $store.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
                $store.Add($storeCertificate)
              }
              finally {
                $store.Dispose()
              }
            }

            $store = [Security.Cryptography.X509Certificates.X509Store]::new(
              [Security.Cryptography.X509Certificates.StoreName]::My,
              [Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser)
            try {
              $store.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadOnly)
              $storedCertificates = $store.Certificates.Find(
                [Security.Cryptography.X509Certificates.X509FindType]::FindByThumbprint,
                $certificate.Thumbprint,
                $false)
              if ($storedCertificates.Count -ne 1 -or -not $storedCertificates[0].HasPrivateKey) {
                throw "The CI signing key was not persisted in the user certificate store."
              }
            }
            finally {
              $store.Dispose()
            }

            "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
            "subject=$($certificate.Subject)" >> $env:GITHUB_OUTPUT
            $installationComplete = $true
          }
          finally {
            if (-not $installationComplete -and $null -ne $certificate) {
              if ($null -ne $publicCertificate) {
                foreach ($storeName in @(
                  [Security.Cryptography.X509Certificates.StoreName]::Root,
                  [Security.Cryptography.X509Certificates.StoreName]::TrustedPublisher
                )) {
                  $store = [Security.Cryptography.X509Certificates.X509Store]::new(
                    $storeName,
                    [Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser)
                  try {
                    $store.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
                    $store.Remove($publicCertificate)
                  }
                  catch {
                    Write-Warning "Could not roll back CurrentUser/${storeName}: $($_.Exception.Message)"
                  }
                  finally {
                    $store.Dispose()
                  }
                }
              }
              $myCertificatePath = "Cert:/CurrentUser/My/$($certificate.Thumbprint)"
              $privateKeyDeleted = $false
              try {
                if (Test-Path -LiteralPath $myCertificatePath) {
                  Remove-Item -LiteralPath $myCertificatePath -DeleteKey -Force -ErrorAction Stop
                  $privateKeyDeleted = $true
                }
              }
              catch {
                Write-Warning "Could not roll back the CI signing key: $($_.Exception.Message)"
              }
              if (-not $privateKeyDeleted) {
                $privateKey = $null
                try {
                  $privateKey = [Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPrivateKey(
                    $certificate)
                  if ($privateKey -is [Security.Cryptography.RSACng]) {
                    $privateKey.Key.Delete()
                  }
                  elseif ($privateKey -is [Security.Cryptography.RSACryptoServiceProvider]) {
                    $privateKey.PersistKeyInCsp = $false
                    $privateKey.Clear()
                  }
                  else {
                    Write-Warning "The persisted CI signing key uses an unknown RSA provider."
                  }
                }
                catch {
                  Write-Warning "Could not delete the persisted CI signing key: $($_.Exception.Message)"
                }
                finally {
                  if ($null -ne $privateKey) {
                    $privateKey.Dispose()
                  }
                }
              }
            }
            if ($null -ne $publicCertificate) {
              $publicCertificate.Dispose()
            }
            if ($null -ne $certificate) {
              $certificate.Dispose()
            }
            [Array]::Clear($passwordBytes, 0, $passwordBytes.Length)
            Remove-Item $certificateDirectory -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Test-sign and package x64 and ARM64 applications
        shell: pwsh
        run: |
          $signing = @{
            SignaturePolicy = "Test"
            CertificateThumbprint = "${{ steps.ci-signing.outputs.thumbprint }}"
            ExpectedPublisherSubject = "${{ steps.ci-signing.outputs.subject }}"
          }
          ./Windows/scripts/package.ps1 -Runtime win-x64 @signing
          ./Windows/scripts/package.ps1 -Runtime win-arm64 @signing
          $archives = @(Get-ChildItem artifacts/windows/*.zip)
          if ($archives.Count -ne 2) {
            throw "Expected exactly two Windows archives, found $($archives.Count)."
          }
          $archives | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content artifacts/windows/DiskInventoryZed-Windows-checksums.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DiskInventoryZed-Windows-CI
          path: |
            artifacts/windows/*.zip
            artifacts/windows/DiskInventoryZed-Windows-checksums.txt
          if-no-files-found: error
          overwrite: true

      - name: Remove ephemeral CI code-signing certificate
        if: always() && steps.ci-signing.outputs.thumbprint != ''
        shell: pwsh
        run: |
          $thumbprint = "${{ steps.ci-signing.outputs.thumbprint }}"
          $cleanupErrors = [System.Collections.Generic.List[string]]::new()
          $certificatePaths = @(
            "Cert:/CurrentUser/Root/$thumbprint",
            "Cert:/CurrentUser/TrustedPublisher/$thumbprint"
          )
          foreach ($path in $certificatePaths) {
            try {
              if (Test-Path -LiteralPath $path) {
                Remove-Item -LiteralPath $path -Force -ErrorAction Stop
              }
            }
            catch {
              [void]$cleanupErrors.Add("${path}: $($_.Exception.Message)")
            }
          }
          $myCertificatePath = "Cert:/CurrentUser/My/$thumbprint"
          try {
            if (Test-Path -LiteralPath $myCertificatePath) {
              Remove-Item -LiteralPath $myCertificatePath -DeleteKey -Force -ErrorAction Stop
            }
          }
          catch {
            [void]$cleanupErrors.Add("${myCertificatePath}: $($_.Exception.Message)")
          }
          foreach ($path in $certificatePaths + $myCertificatePath) {
            if (Test-Path -LiteralPath $path) {
              [void]$cleanupErrors.Add("Certificate remains in $path.")
            }
          }
          if ($cleanupErrors.Count -ne 0) {
            throw "Ephemeral certificate cleanup failed: $($cleanupErrors -join '; ')"
          }

  windows-signing:
    needs: [validate, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 30
    environment: release-signing
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Checkout trusted release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Import production Authenticode certificate
        id: production-signing
        shell: powershell
        timeout-minutes: 2
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          EXPECTED_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT }}
          EXPECTED_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER_SUBJECT }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          foreach ($value in @(
            $env:CERTIFICATE_BASE64,
            $env:CERTIFICATE_PASSWORD,
            $env:EXPECTED_THUMBPRINT,
            $env:EXPECTED_PUBLISHER,
            $env:TIMESTAMP_URL
          )) {
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Tagged Windows releases require complete protected signing configuration."
            }
          }

          try {
            $bytes = [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          }
          catch [FormatException] {
            throw "The Windows signing certificate is not valid Base64."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "DiskInventoryZed-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, $bytes)
          $existingThumbprints = @{}
          $store = [Security.Cryptography.X509Certificates.X509Store]::new(
            [Security.Cryptography.X509Certificates.StoreName]::My,
            [Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser)
          try {
            $store.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadOnly)
            foreach ($existingCertificate in $store.Certificates) {
              $existingThumbprints[$existingCertificate.Thumbprint] = $true
            }
          }
          finally {
            $store.Dispose()
          }

          $importComplete = $false
          try {
            $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificates = @(Import-PfxCertificate `
              -FilePath $certificatePath `
              -CertStoreLocation Cert:/CurrentUser/My `
              -Password $password `
              -Exportable:$false |
                Where-Object HasPrivateKey)
            if ($certificates.Count -ne 1) {
              throw "The Windows signing bundle must contain exactly one private code-signing certificate."
            }

            $certificate = $certificates[0]
            $expectedThumbprint = $env:EXPECTED_THUMBPRINT.Replace(" ", "").ToUpperInvariant()
            if ($certificate.Thumbprint -cne $expectedThumbprint) {
              throw "The imported Windows signing certificate thumbprint is not allowlisted."
            }
            if ($certificate.Subject -cne $env:EXPECTED_PUBLISHER) {
              throw "The imported Windows signing certificate publisher is not allowlisted."
            }
            "thumbprint=$($certificate.Thumbprint)" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "subject=$($certificate.Subject)" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            $importComplete = $true
          }
          finally {
            if (-not $importComplete) {
              $store = [Security.Cryptography.X509Certificates.X509Store]::new(
                [Security.Cryptography.X509Certificates.StoreName]::My,
                [Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser)
              try {
                $store.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadOnly)
                $newThumbprints = @(
                  $store.Certificates |
                    Where-Object { -not $existingThumbprints.ContainsKey($_.Thumbprint) } |
                    ForEach-Object Thumbprint)
              }
              finally {
                $store.Dispose()
              }
              foreach ($newThumbprint in $newThumbprints) {
                $importedCertificatePath = "Cert:/CurrentUser/My/$newThumbprint"
                if (Test-Path -LiteralPath $importedCertificatePath) {
                  Remove-Item `
                    -LiteralPath $importedCertificatePath `
                    -DeleteKey `
                    -Force `
                    -ErrorAction Stop
                }
              }
            }
          }

      - name: Sign, timestamp, and package Windows releases
        shell: pwsh
        env:
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $signing = @{
            SignaturePolicy = "Release"
            CertificateThumbprint = "${{ steps.production-signing.outputs.thumbprint }}"
            ExpectedPublisherSubject = "${{ steps.production-signing.outputs.subject }}"
            TimestampUrl = $env:TIMESTAMP_URL
          }
          ./Windows/scripts/package.ps1 -Runtime win-x64 @signing
          ./Windows/scripts/package.ps1 -Runtime win-arm64 @signing
          $archives = @(Get-ChildItem artifacts/windows/*.zip)
          if ($archives.Count -ne 2) {
            throw "Expected exactly two signed Windows archives, found $($archives.Count)."
          }
          $archives | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content artifacts/windows/DiskInventoryZed-Windows-checksums.txt

      - name: Attest signed Windows provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: artifacts/windows/DiskInventoryZed-Windows-checksums.txt

      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DiskInventoryZed-Windows
          path: |
            artifacts/windows/*.zip
            artifacts/windows/DiskInventoryZed-Windows-checksums.txt
          if-no-files-found: error
          overwrite: false

      - name: Remove production signing material
        if: always()
        shell: pwsh
        run: |
          $thumbprint = "${{ steps.production-signing.outputs.thumbprint }}"
          try {
            if (-not [string]::IsNullOrWhiteSpace($thumbprint)) {
              $thumbprint = $thumbprint.Replace(" ", "").ToUpperInvariant()
              if ($thumbprint -notmatch '^[0-9A-F]{40,64}$') {
                throw "The production signing certificate thumbprint is invalid."
              }
              $certificatePath = "Cert:/CurrentUser/My/$thumbprint"
              if (Test-Path -LiteralPath $certificatePath) {
                Remove-Item -LiteralPath $certificatePath -DeleteKey -Force -ErrorAction Stop
              }
              if (Test-Path -LiteralPath $certificatePath) {
                throw "Production signing certificate cleanup failed."
              }
            }
          }
          finally {
            Remove-Item (Join-Path $env:RUNNER_TEMP "DiskInventoryZed-signing.pfx") `
              -Force `
              -ErrorAction SilentlyContinue
          }

  publish-release:
    needs: [validate, build, windows, macos-signing, windows-signing]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-publish
    if: >-
      ${{ always() && startsWith(github.ref, 'refs/tags/v') &&
          needs.validate.result == 'success' &&
          needs.build.result == 'success' &&
          needs.windows.result == 'success' &&
          needs.macos-signing.result == 'success' &&
          needs.windows-signing.result == 'success' }}
    permissions:
      contents: write

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify immutable releases are enforced
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SETTINGS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "release-publish requires a repository-scoped Administration read token." >&2
            exit 1
          fi
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled)" != "true" ]; then
            echo "Immutable GitHub releases must be enabled before publication." >&2
            exit 1
          fi
          RULESETS_JSON="$RUNNER_TEMP/tag-rulesets.json"
          gh api "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true&targets=tag&per_page=100" > "$RULESETS_JSON"
          PROTECTED_TAGS=false
          while IFS= read -r RULESET_ID; do
            [ -n "$RULESET_ID" ] || continue
            RULESET_JSON="$RUNNER_TEMP/tag-ruleset-$RULESET_ID.json"
            gh api "repos/$GITHUB_REPOSITORY/rulesets/$RULESET_ID?includes_parents=true" > "$RULESET_JSON"
            if python3 - "$RULESET_JSON" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              ruleset = json.load(source)
          conditions = ruleset.get("conditions", {}).get("ref_name", {})
          rule_types = {rule.get("type") for rule in ruleset.get("rules", [])}
          valid = (
              ruleset.get("target") == "tag" and
              ruleset.get("enforcement") == "active" and
              conditions.get("include") == ["refs/tags/v*"] and
              conditions.get("exclude") == [] and
              {"update", "deletion"} <= rule_types and
              ruleset.get("bypass_actors") == []
          )
          raise SystemExit(0 if valid else 1)
          PY
            then
              PROTECTED_TAGS=true
              break
            fi
          done < <(jq -r '.[] | select(.target == "tag" and .enforcement == "active") | .id' "$RULESETS_JSON")
          if [ "$PROTECTED_TAGS" != "true" ]; then
            echo "An active, non-bypassable v* tag update/deletion ruleset is required." >&2
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DiskInventoryZed-DMG

      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DiskInventoryZed-Windows
          path: windows-release

      - name: Verify release artifacts
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 scripts/release_integrity.py verify-local --version "$VERSION"
          sha256sum --check --strict DiskInventoryZed-checksums.txt
          (cd windows-release && sha256sum --check --strict DiskInventoryZed-Windows-checksums.txt)

      - name: Create and verify draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          resolve_tag_commit() {
            local object_type object_sha
            read -r object_type object_sha <<< "$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" \
              --jq '.object.type + " " + .object.sha')"
            for _ in {1..5}; do
              if [ "$object_type" = "commit" ]; then
                printf '%s\n' "$object_sha"
                return 0
              fi
              if [ "$object_type" != "tag" ]; then
                echo "Unsupported release tag target type: $object_type" >&2
                return 1
              fi
              read -r object_type object_sha <<< "$(gh api \
                "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                --jq '.object.type + " " + .object.sha')"
            done
            echo "Release tag nesting exceeds the supported depth." >&2
            return 1
          }
          TAG_COMMIT="$(resolve_tag_commit)"
          if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "Release tag moved from validated commit $GITHUB_SHA to $TAG_COMMIT." >&2
            exit 1
          fi
          MARKER="<!-- disk-inventory-zed-workflow-run:$GITHUB_RUN_ID -->"
          RELEASE_JSON="$RUNNER_TEMP/disk-inventory-zed-release.json"
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          # shellcheck disable=SC2016
          gh api graphql \
            -f query='query($owner:String!, $name:String!, $tag:String!) { repository(owner:$owner, name:$name) { release(tagName:$tag) { databaseId isDraft isPrerelease description tagName } } }' \
            -f owner="$GITHUB_REPOSITORY_OWNER" \
            -f name="$REPOSITORY_NAME" \
            -f tag="$TAG_NAME" > "$RELEASE_JSON"
          RELEASE_STATE="$(python3 scripts/release_integrity.py classify-release \
            --json "$RELEASE_JSON" \
            --tag "$TAG_NAME" \
            --marker "$MARKER")"
          EXPECTED_RELEASE_ID=""
          if [ "$RELEASE_STATE" = "draft" ]; then
            EXPECTED_RELEASE_ID="$(python3 scripts/release_integrity.py uploaded-draft-id \
              --json "$RELEASE_JSON" \
              --tag "$TAG_NAME" \
              --marker "$MARKER")"
          fi
          ASSETS=(
            "DiskInventoryZed-$VERSION.dmg"
            DiskInventoryZed-checksums.txt
            "windows-release/DiskInventoryZed-Windows-v$VERSION-win-x64.zip"
            "windows-release/DiskInventoryZed-Windows-v$VERSION-win-arm64.zip"
            windows-release/DiskInventoryZed-Windows-checksums.txt
          )
          if [ "$RELEASE_STATE" = "draft" ]; then
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          elif [ "$RELEASE_STATE" = "missing" ]; then
            gh release create "$TAG_NAME" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --generate-notes \
              --notes "$MARKER" \
              --title "Disk Inventory Zed $VERSION"
          fi
          RELEASE_AFTER_UPLOAD="$RUNNER_TEMP/disk-inventory-zed-release-after-upload.json"
          # shellcheck disable=SC2016
          gh api graphql \
            -f query='query($owner:String!, $name:String!, $tag:String!) { repository(owner:$owner, name:$name) { release(tagName:$tag) { databaseId isDraft isPrerelease description tagName } } }' \
            -f owner="$GITHUB_REPOSITORY_OWNER" \
            -f name="$REPOSITORY_NAME" \
            -f tag="$TAG_NAME" > "$RELEASE_AFTER_UPLOAD"
          RELEASE_ID="$(python3 scripts/release_integrity.py uploaded-draft-id \
            --json "$RELEASE_AFTER_UPLOAD" \
            --tag "$TAG_NAME" \
            --marker "$MARKER")"
          test "$RELEASE_ID" -gt 0
          if [ -n "$EXPECTED_RELEASE_ID" ] && [ "$RELEASE_ID" != "$EXPECTED_RELEASE_ID" ]; then
            echo "The draft release identity changed during asset upload." >&2
            exit 1
          fi
          RELEASE_BEFORE_DOWNLOAD="$RUNNER_TEMP/disk-inventory-zed-release-before-download.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RELEASE_BEFORE_DOWNLOAD"
          mkdir release-download
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir release-download
          RELEASE_AFTER_DOWNLOAD="$RUNNER_TEMP/disk-inventory-zed-release-after-download.json"
          VERIFIED_RELEASE_STATE="$RUNNER_TEMP/disk-inventory-zed-verified-release-state.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RELEASE_AFTER_DOWNLOAD"
          python3 scripts/release_integrity.py verify-download \
            --version "$VERSION" \
            --download-dir release-download \
            --before-json "$RELEASE_BEFORE_DOWNLOAD" \
            --after-json "$RELEASE_AFTER_DOWNLOAD" \
            --tag "$TAG_NAME" \
            --marker "$MARKER" \
            --state-out "$VERIFIED_RELEASE_STATE"
          (cd release-download && sha256sum --check --strict DiskInventoryZed-checksums.txt)
          (cd release-download && sha256sum --check --strict DiskInventoryZed-Windows-checksums.txt)

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          resolve_tag_commit() {
            local object_type object_sha
            read -r object_type object_sha <<< "$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" \
              --jq '.object.type + " " + .object.sha')"
            for _ in {1..5}; do
              if [ "$object_type" = "commit" ]; then
                printf '%s\n' "$object_sha"
                return 0
              fi
              if [ "$object_type" != "tag" ]; then
                echo "Unsupported release tag target type: $object_type" >&2
                return 1
              fi
              read -r object_type object_sha <<< "$(gh api \
                "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                --jq '.object.type + " " + .object.sha')"
            done
            echo "Release tag nesting exceeds the supported depth." >&2
            return 1
          }
          TAG_COMMIT="$(resolve_tag_commit)"
          if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "Release tag moved from validated commit $GITHUB_SHA to $TAG_COMMIT." >&2
            exit 1
          fi
          MARKER="<!-- disk-inventory-zed-workflow-run:$GITHUB_RUN_ID -->"
          RELEASE_JSON="$RUNNER_TEMP/disk-inventory-zed-release-before-publish.json"
          VERIFIED_RELEASE_STATE="$RUNNER_TEMP/disk-inventory-zed-verified-release-state.json"
          RELEASE_ID="$(jq -r '.id' "$VERIFIED_RELEASE_STATE")"
          test "$RELEASE_ID" -gt 0
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RELEASE_JSON"
          python3 scripts/release_integrity.py verify-draft \
            --json "$RELEASE_JSON" \
            --state "$VERIFIED_RELEASE_STATE" \
            --version "$VERSION" \
            --tag "$TAG_NAME" \
            --marker "$MARKER"
          TAG_COMMIT="$(resolve_tag_commit)"
          if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "Release tag moved immediately before publication." >&2
            exit 1
          fi
          PUBLISHED_RELEASE="$RUNNER_TEMP/disk-inventory-zed-published-release.json"
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=legacy > "$PUBLISHED_RELEASE"
          python3 scripts/release_integrity.py verify-published \
            --json "$PUBLISHED_RELEASE" \
            --state "$VERIFIED_RELEASE_STATE" \
            --version "$VERSION" \
            --tag "$TAG_NAME" \
            --marker "$MARKER"
          PUBLISHED_TAG_COMMIT="$(resolve_tag_commit)"
          if [ "$PUBLISHED_TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "The immutable release locked an unexpected tag target." >&2
            exit 1
          fi
