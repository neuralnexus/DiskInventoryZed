name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disk-inventory-zed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Swift 6 unit tests
        run: |
          swift test \
            -Xswiftc -swift-version -Xswiftc 6 \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warnings-as-errors

      - name: Build debug in Swift 6 language mode
        run: |
          swift build \
            -Xswiftc -swift-version -Xswiftc 6 \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warnings-as-errors
      
      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64
      
      - name: Package and verify app bundle
        env:
          SIGNING_IDENTITY: '-'
        run: ./scripts/package-app.sh
      
      - name: Create DMG
        env:
          SIGNING_IDENTITY: '-'
        run: |
          ./scripts/create-dmg.sh

      - name: Generate release checksums
        run: shasum -a 256 DiskInventoryZed-*.dmg > DiskInventoryZed-checksums.txt

      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent DiskInventoryZed.app DiskInventoryZed.app.zip

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskInventoryZed-DMG
          path: |
            DiskInventoryZed-*.dmg
            DiskInventoryZed-checksums.txt
          if-no-files-found: error
      
      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskInventoryZed-App
          path: DiskInventoryZed.app.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"

      - name: Compile signal bridge with strict C diagnostics
        run: |
          clang -std=c11 -Wall -Wextra -Werror -pedantic \
            -I CLinuxSignals/include \
            -c CLinuxSignals/CLinuxSignals.c \
            -o "$RUNNER_TEMP/CLinuxSignals.o"

      - name: Run Linux unit tests
        run: swift test -Xswiftc -strict-concurrency=complete

      - name: Build Linux CLI with concurrency diagnostics
        run: swift build -c release -Xswiftc -strict-concurrency=complete

      - name: Smoke test Linux CLI
        run: |
          INPUT="$RUNNER_TEMP/disk-inventory-zed-input"
          OUTPUT="$RUNNER_TEMP/disk-inventory-zed-scan.json"
          mkdir -p "$INPUT/nested"
          printf 'linux smoke test\n' > "$INPUT/nested/file.txt"
          BIN="$(swift build -c release --show-bin-path)/DiskInventoryZed"
          "$BIN" --help
          "$BIN" --json "$OUTPUT" "$INPUT"
          test "$(stat -c '%a' "$OUTPUT")" = 600
          python3 - "$OUTPUT" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              scan = json.load(source)
          assert scan["schemaVersion"] == 4
          assert any(entry["name"] == "file.txt" for entry in scan["entries"])
          PY

  linux-distributions:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: swift:6.3.3-noble
          - name: Debian 12
            image: swift:6.3.3-bookworm
          - name: Amazon Linux 2
            image: swift:6.3.3-amazonlinux2
          - name: Red Hat UBI 9
            image: swift:6.3.3-rhel-ubi9

    name: Linux source smoke (${{ matrix.name }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and smoke test CLI
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            "${{ matrix.image }}" \
            /bin/bash -lc '
              swift build -c release --scratch-path /tmp/diz-build -Xswiftc -strict-concurrency=complete &&
              mkdir -p /tmp/diz-input/nested &&
              printf "distribution smoke test\n" > /tmp/diz-input/nested/file.txt &&
              /tmp/diz-build/x86_64-unknown-linux-gnu/release/DiskInventoryZed --json /tmp/scan.json /tmp/diz-input >/dev/null &&
              test -s /tmp/scan.json
            '

  linux-portable:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.3"

      - name: Install Static Linux SDK
        run: |
          swift sdk install \
            https://download.swift.org/swift-6.3.3-release/static-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz \
            --checksum 87c3eaf908e67c0e13a84367119e12273cec1d2cd3d81f7d74bb36722d6b607b

      - name: Build portable Linux archives
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          ./scripts/package-linux.sh x86_64-swift-linux-musl dist
          ./scripts/package-linux.sh aarch64-swift-linux-musl dist
          mkdir -p dist/smoke/x86_64 dist/smoke/aarch64
          tar -xzf dist/DiskInventoryZed-*-linux-x86_64.tar.gz \
            -C dist/smoke/x86_64 --strip-components=1
          tar -xzf dist/DiskInventoryZed-*-linux-aarch64.tar.gz \
            -C dist/smoke/aarch64 --strip-components=1
          test -x dist/smoke/x86_64/DiskInventoryZed
          test -x dist/smoke/aarch64/DiskInventoryZed
          file dist/smoke/x86_64/DiskInventoryZed | grep -Eq 'ELF 64-bit.*x86-64.*statically linked'
          file dist/smoke/aarch64/DiskInventoryZed | grep -Eq 'ELF 64-bit.*ARM aarch64.*statically linked'

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Smoke test portable binaries
        run: |
          smoke_binary() {
            local platform="$1"
            local image="$2"
            local binary="$3"
            docker run --rm --platform "$platform" \
              -v "$GITHUB_WORKSPACE/$binary:/opt/DiskInventoryZed:ro" \
              "$image" /bin/sh -c '
                mkdir -p /tmp/diz-input/nested &&
                printf "portable smoke test\n" > /tmp/diz-input/nested/file.txt &&
                /opt/DiskInventoryZed --json /tmp/scan.json /tmp/diz-input >/dev/null &&
                test -s /tmp/scan.json
              '
          }

          for image in ubuntu:22.04 ubuntu:24.04 debian:12 fedora:42 rockylinux:9 alpine:3.23; do
            smoke_binary linux/amd64 "$image" dist/smoke/x86_64/DiskInventoryZed
          done
          smoke_binary linux/arm64 ubuntu:22.04 dist/smoke/aarch64/DiskInventoryZed
          smoke_binary linux/arm64 alpine:3.23 dist/smoke/aarch64/DiskInventoryZed

      - name: Verify portable signal cancellation
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE/dist/smoke/x86_64/DiskInventoryZed:/opt/DiskInventoryZed:ro" \
            alpine:3.23 /bin/sh -c '
              set -eu
              mkdir -p /tmp/diz-input
              index=0
              while [ "$index" -lt 50000 ]; do
                : > "/tmp/diz-input/file-$index"
                index=$((index + 1))
              done
              probe_signal() {
                signal_name="$1"
                expected_status="$2"
                output="/tmp/scan-$signal_name.json"
                errors="/tmp/errors-$signal_name.txt"
                /opt/DiskInventoryZed --json "$output" /tmp/diz-input \
                  >/dev/null 2>"$errors" &
                process_id=$!
                handlers_ready=false
                attempt=0
                while [ "$attempt" -lt 500 ]; do
                  if ! kill -0 "$process_id" 2>/dev/null; then
                    break
                  fi
                  caught_mask="$(grep "^SigCgt:" "/proc/$process_id/status" 2>/dev/null | cut -f2 || true)"
                  if printf "%s\n" "$caught_mask" |
                    grep -Eq "[4567cdefCDEF][0-9a-fA-F]{2}[2367abefABEF]$"; then
                    handlers_ready=true
                    break
                  fi
                  attempt=$((attempt + 1))
                  sleep 0.01
                done
                test "$handlers_ready" = true
                kill -s "$signal_name" "$process_id"
                set +e
                wait "$process_id"
                status=$?
                set -e
                test "$status" -eq "$expected_status"
                test ! -e "$output"
                grep -q "Scan cancelled" "$errors"
              }
              probe_signal INT 130
              probe_signal TERM 143
            '

      - name: Generate Linux checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz > DiskInventoryZed-linux-checksums.txt

      - name: Upload portable Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DiskInventoryZed-Linux
          path: |
            dist/*.tar.gz
            dist/DiskInventoryZed-linux-checksums.txt
          if-no-files-found: error

  release:
    needs: [build, linux, linux-distributions, linux-portable]
    runs-on: macos-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release provenance and credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          EXPECTED_TAG="v${VERSION}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Release tag '$GITHUB_REF_NAME' must match Info.plist version '$EXPECTED_TAG'." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" != "$MAIN_SHA" ]; then
            echo "Tagged release commit must be the current origin/main commit." >&2
            exit 1
          fi
          : "${APPLE_ID:?APPLE_ID secret is required for tagged releases}"
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID secret is required for tagged releases}"
          : "${APPLE_APP_PASSWORD:?APPLE_APP_PASSWORD secret is required for tagged releases}"
          : "${APPLE_SIGNING_IDENTITY:?APPLE_SIGNING_IDENTITY secret is required for tagged releases}"
          : "${APPLE_SIGNING_CERTIFICATE_BASE64:?APPLE_SIGNING_CERTIFICATE_BASE64 secret is required for tagged releases}"
          : "${APPLE_SIGNING_CERTIFICATE_PASSWORD:?APPLE_SIGNING_CERTIFICATE_PASSWORD secret is required for tagged releases}"

      - name: Check release state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          RESPONSE_PATH="$RUNNER_TEMP/release-lookup.json"
          if ! gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName,isDraft > "$RESPONSE_PATH"; then
            echo "Could not determine whether release '$TAG_NAME' exists." >&2
            exit 1
          fi
          RELEASE_STATE="$(
            python3 - "$RESPONSE_PATH" "$TAG_NAME" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              releases = json.load(source)
          release = next((item for item in releases if item["tagName"] == sys.argv[2]), None)
          if release is None:
              print("missing")
          elif release["isDraft"]:
              print("draft")
          else:
              print("published")
          PY
          )"
          case "$RELEASE_STATE" in
            missing)
              echo "REUSE_RELEASE_DRAFT=false" >> "$GITHUB_ENV"
              ;;
            draft)
              echo "REUSE_RELEASE_DRAFT=true" >> "$GITHUB_ENV"
              ;;
            published)
              echo "Published release '$TAG_NAME' already exists; refusing to replace its assets." >&2
              exit 1
              ;;
          esac

      - name: Import Developer ID certificate
        env:
          APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          umask 077
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/disk-inventory-zed-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "SIGNING_CERTIFICATE_PATH=$CERTIFICATE_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_SIGNING_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_SIGNING_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

      - name: Build signed universal apps
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          swift build -c release --arch arm64 --arch x86_64
          ./scripts/package-app.sh
          HELPER_APP="$RUNNER_TEMP/First-Run-Helper.app"
          ./scripts/package-helper.sh "$HELPER_APP"
          echo "PREBUILT_HELPER_APP=$HELPER_APP" >> "$GITHUB_ENV"

      - name: Notarize signed applications
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ./scripts/notarize.sh DiskInventoryZed.app
          ./scripts/notarize.sh "$PREBUILT_HELPER_APP"

      - name: Create signed DMG
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./scripts/create-dmg.sh

      - name: Notarize tagged release
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/notarize.sh DiskInventoryZed-*.dmg

      - name: Download portable Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: DiskInventoryZed-Linux
          path: linux-dist

      - name: Verify and prepare portable Linux artifacts
        run: |
          python3 - linux-dist/DiskInventoryZed-linux-checksums.txt linux-dist/*.tar.gz <<'PY'
          import hashlib
          from pathlib import Path
          import string
          import sys

          manifest_path = Path(sys.argv[1])
          archives = {Path(value).name: Path(value) for value in sys.argv[2:]}
          expected = {}
          for line in manifest_path.read_text(encoding="utf-8").splitlines():
              fields = line.split(maxsplit=1)
              if len(fields) != 2 or len(fields[0]) != 64 or any(
                  character not in string.hexdigits for character in fields[0]
              ):
                  raise SystemExit(f"Malformed checksum line: {line!r}")
              if fields[1] in expected:
                  raise SystemExit(f"Duplicate checksum entry: {fields[1]}")
              expected[fields[1]] = fields[0].lower()

          if set(expected) != set(archives):
              raise SystemExit("Linux checksum manifest does not match downloaded archives")
          for name, path in archives.items():
              digest = hashlib.sha256()
              with path.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""):
                      digest.update(chunk)
              if digest.hexdigest() != expected[name]:
                  raise SystemExit(f"Checksum mismatch: {name}")
          PY
          cp linux-dist/*.tar.gz .

      - name: Generate release checksums
        run: shasum -a 256 DiskInventoryZed-*.dmg DiskInventoryZed-*-linux-*.tar.gz > DiskInventoryZed-checksums.txt
      
      - name: Create and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ "${REUSE_RELEASE_DRAFT:-false}" != true ]; then
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --draft
          fi
          gh release upload "$TAG_NAME" \
            DiskInventoryZed-*.dmg \
            DiskInventoryZed-*-linux-*.tar.gz \
            DiskInventoryZed-checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_CERTIFICATE_PATH:-}" ]; then
            rm -f "$SIGNING_CERTIFICATE_PATH"
          fi
          if [ -n "${SIGNING_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          fi
