name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disk-inventory-zed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run unit tests
        run: swift test

      - name: Build debug with concurrency diagnostics
        run: swift build -Xswiftc -strict-concurrency=complete
      
      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64
      
      - name: Package and verify app bundle
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./scripts/package-app.sh
      
      - name: Create DMG
        run: |
          ./scripts/create-dmg.sh

      - name: Notarize tagged release when credentials are configured
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            ./scripts/notarize.sh DiskInventoryZed-*.dmg
          else
            echo "Notarization credentials are not configured; publishing an unnotarized build."
          fi

      - name: Generate release checksums
        run: shasum -a 256 DiskInventoryZed-*.dmg > DiskInventoryZed-checksums.txt

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskInventoryZed-DMG
          path: |
            DiskInventoryZed-*.dmg
            DiskInventoryZed-checksums.txt
          if-no-files-found: error
      
      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskInventoryZed-App
          path: DiskInventoryZed.app
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Windows solution
        shell: pwsh
        run: dotnet restore Windows/DiskInventoryZed.Windows.sln

      - name: Run Windows core and NTFS tests
        shell: pwsh
        run: dotnet test Windows/tests/DiskInventoryZed.Core.Tests/DiskInventoryZed.Core.Tests.csproj -c Release --no-restore

      - name: Build Windows desktop application
        shell: pwsh
        run: dotnet build Windows/src/DiskInventoryZed.Windows/DiskInventoryZed.Windows.csproj -c Release --no-restore

      - name: Package x64 and ARM64 applications
        shell: pwsh
        run: |
          ./Windows/scripts/package.ps1 -Runtime win-x64
          ./Windows/scripts/package.ps1 -Runtime win-arm64
          Get-ChildItem artifacts/windows/*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content artifacts/windows/DiskInventoryZed-Windows-checksums.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DiskInventoryZed-Windows
          path: |
            artifacts/windows/*.zip
            artifacts/windows/DiskInventoryZed-Windows-checksums.txt
          if-no-files-found: error

  release:
    needs: [build, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(python3 - <<'PY'
            import plistlib
            with open("Resources/Info.plist", "rb") as source:
                print(plistlib.load(source)["CFBundleShortVersionString"])
            PY
            )"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether release exists
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        if: steps.existing.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: DiskInventoryZed-DMG

      - name: Download Windows artifacts
        if: steps.existing.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: DiskInventoryZed-Windows
          path: windows-release
      
      - name: Create Release
        if: steps.existing.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            DiskInventoryZed-*.dmg
            DiskInventoryZed-checksums.txt
            windows-release/*.zip
            windows-release/DiskInventoryZed-Windows-checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
