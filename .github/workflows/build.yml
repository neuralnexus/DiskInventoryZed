name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Swift
        uses: swift-actions/setup-swift@v1
        with:
          swift-version: '5.9'
      
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      
      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64
      
      - name: Create app bundle
        run: |
          APP_NAME="DiskInventoryZed"
          BUNDLE_ID="com.diskinventoryzed.DiskInventoryZed"
          BUILD_CONFIG="release"
          
          # Find the built binary
          BINARY_PATH=".build/apple/Products/$BUILD_CONFIG/$APP_NAME"
          
          if [ ! -f "$BINARY_PATH" ]; then
            echo "Error: Binary not found at $BINARY_PATH"
            exit 1
          fi
          
          # Create app bundle structure
          APP_BUNDLE="$APP_NAME.app"
          rm -rf "$APP_BUNDLE"
          
          mkdir -p "$APP_BUNDLE/Contents/MacOS"
          mkdir -p "$APP_BUNDLE/Contents/Resources"
          
          # Copy binary
          cp "$BINARY_PATH" "$APP_BUNDLE/Contents/MacOS/"
          
          # Create Info.plist
          cat > "$APP_BUNDLE/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>$APP_NAME</string>
              <key>CFBundleIdentifier</key>
              <string>$BUNDLE_ID</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Disk Inventory Zed</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>LSApplicationCategoryType</key>
              <string>public.app-category.utilities</string>
              <key>NSHumanReadableCopyright</key>
              <string>Copyright 2026 Matt Ivan. Licensed under GPL-3.0.</string>
              <key>LSUIElement</key>
              <false/>
          </dict>
          </plist>
          EOF
          
          # Create entitlements file
          cat > "$APP_BUNDLE.entitlements" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.app-sandbox</key>
              <false/>
          </dict>
          </plist>
          EOF
          
          # Ad-hoc sign the app
          codesign --force --deep --sign - "$APP_BUNDLE"
          
          # Verify architecture
          echo "Supported architectures:"
          lipo -archs "$APP_BUNDLE/Contents/MacOS/$APP_NAME"
      
      - name: Create DMG
        run: |
          APP_NAME="DiskInventoryZed"
          DMG_NAME="DiskInventoryZed"
          VERSION="1.0"
          
          # Create a temporary directory for the DMG contents
          mkdir -p "dmg-temp"
          cp -R "$APP_NAME.app" "dmg-temp/"
          
          # Create a symlink to Applications folder
          ln -s /Applications "dmg-temp/Applications"
          
          # Create DMG
          hdiutil create -volname "Disk Inventory Zed" \
            -srcfolder "dmg-temp" \
            -ov -format UDZO \
            "${DMG_NAME}-${VERSION}.dmg"
          
          # Verify DMG
          ls -lh "${DMG_NAME}-${VERSION}.dmg"
      
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskInventoryZed-DMG
          path: DiskInventoryZed-*.dmg
          if-no-files-found: error
      
      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskInventoryZed-App
          path: DiskInventoryZed.app
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: DiskInventoryZed-DMG
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: DiskInventoryZed-*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}