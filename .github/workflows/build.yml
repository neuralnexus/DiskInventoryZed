name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disk-inventory-zed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run unit tests
        run: swift test

      - name: Build debug with concurrency diagnostics
        run: swift build -Xswiftc -strict-concurrency=complete
      
      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64
      
      - name: Package and verify app bundle
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./scripts/package-app.sh
      
      - name: Create DMG
        run: |
          ./scripts/create-dmg.sh

      - name: Notarize tagged release when credentials are configured
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            ./scripts/notarize.sh DiskInventoryZed-*.dmg
          else
            echo "Notarization credentials are not configured; publishing an unnotarized build."
          fi

      - name: Generate release checksums
        run: shasum -a 256 DiskInventoryZed-*.dmg > DiskInventoryZed-checksums.txt

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskInventoryZed-DMG
          path: |
            DiskInventoryZed-*.dmg
            DiskInventoryZed-checksums.txt
          if-no-files-found: error
      
      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskInventoryZed-App
          path: DiskInventoryZed.app
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="$(python3 - <<'PY'
          import plistlib
          with open("Resources/Info.plist", "rb") as source:
              print(plistlib.load(source)["CFBundleShortVersionString"])
          PY
          )"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check whether release exists
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        if: steps.existing.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: DiskInventoryZed-DMG
      
      - name: Create Release
        if: steps.existing.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            DiskInventoryZed-*.dmg
            DiskInventoryZed-checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
