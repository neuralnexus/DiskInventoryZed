name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disk-inventory-zed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test release integrity tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_release_integrity.py'

      - name: Validate tagged release source
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            exit 0
          fi
          VERSION="$(python3 - <<'PY'
          import os
          import plistlib
          import re
          import xml.etree.ElementTree as ET

          with open("Resources/Info.plist", "rb") as source:
              mac_version = plistlib.load(source)["CFBundleShortVersionString"]
          windows_version = ET.parse(
              "Windows/src/DiskInventoryZed.Windows/DiskInventoryZed.Windows.csproj"
          ).findtext(".//Version")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", mac_version):
              raise SystemExit(f"Invalid application version: {mac_version!r}")
          if windows_version != mac_version:
              raise SystemExit(
                  f"Version mismatch: macOS={mac_version!r}, Windows={windows_version!r}"
              )
          expected_tag = f"v{mac_version}"
          if os.environ["GITHUB_REF_NAME"] != expected_tag:
              raise SystemExit(
                  f"Release tag {os.environ['GITHUB_REF_NAME']!r} must equal {expected_tag!r}"
              )
          print(mac_version)
          PY
          )"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo "Release tag $GITHUB_REF_NAME is not on origin/main." >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: macos-15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate tagged-release signing configuration
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for value in \
            "$SIGNING_CERTIFICATE" \
            "$SIGNING_CERTIFICATE_PASSWORD" \
            "$KEYCHAIN_PASSWORD" \
            "$SIGNING_IDENTITY" \
            "$APPLE_ID" \
            "$APPLE_TEAM_ID" \
            "$APPLE_APP_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "Tagged releases require complete Apple signing and notarization credentials." >&2
              exit 1
            fi
          done

      - name: Run unit tests
        run: swift test

      - name: Build debug with concurrency diagnostics
        run: swift build -Xswiftc -strict-concurrency=complete
      
      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64

      - name: Install Apple signing certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/DiskInventoryZed-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/DiskInventoryZed-signing.keychain-db"
          printf '%s' "$SIGNING_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$SIGNING_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$SIGNING_IDENTITY"
      
      - name: Package and verify app bundle
        env:
          RELEASE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          SIGNING_IDENTITY="-"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            SIGNING_IDENTITY="$RELEASE_SIGNING_IDENTITY"
          fi
          SIGNING_IDENTITY="$SIGNING_IDENTITY" ./scripts/package-app.sh
      
      - name: Create DMG
        run: |
          ./scripts/create-dmg.sh

      - name: Notarize tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/notarize.sh DiskInventoryZed-*.dmg

      - name: Remove Apple signing certificate
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: |
          security delete-keychain "$RUNNER_TEMP/DiskInventoryZed-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/DiskInventoryZed-signing.p12"

      - name: Archive app bundle artifact
        run: ditto -c -k --sequesterRsrc --keepParent DiskInventoryZed.app DiskInventoryZed.app.zip

      - name: Generate release checksums
        run: shasum -a 256 DiskInventoryZed-*.dmg > DiskInventoryZed-checksums.txt

      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DiskInventoryZed-DMG
          path: |
            DiskInventoryZed-*.dmg
            DiskInventoryZed-checksums.txt
          if-no-files-found: error
          overwrite: true
      
      - name: Upload app bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DiskInventoryZed-App
          path: DiskInventoryZed.app.zip
          if-no-files-found: error
          overwrite: true

  windows:
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.423

      - name: Restore Windows solution
        shell: pwsh
        run: dotnet restore Windows/DiskInventoryZed.Windows.sln --locked-mode

      - name: Run Windows reliability tests with coverage
        shell: pwsh
        run: |
          $projects = @(
            @{
              Name = "Core"
              Path = "Windows/tests/DiskInventoryZed.Core.Tests/DiskInventoryZed.Core.Tests.csproj"
            },
            @{
              Name = "Windows"
              Path = "Windows/tests/DiskInventoryZed.Windows.Tests/DiskInventoryZed.Windows.Tests.csproj"
            }
          )
          foreach ($project in $projects) {
            dotnet test $project.Path `
              -c Release `
              --no-restore `
              --settings Windows/coverage.runsettings `
              --collect "Code Coverage" `
              --blame-hang-timeout 2m `
              --logger "trx;LogFileName=$($project.Name).trx" `
              --results-directory "artifacts/test-results/$($project.Name)"
            if ($LASTEXITCODE -ne 0) {
              throw "$($project.Name) tests failed."
            }
          }

      - name: Validate Windows test and coverage reports
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          foreach ($suite in @("Core", "Windows")) {
            $resultRoot = "artifacts/test-results/$suite"
            $trxReport = Get-ChildItem $resultRoot -Recurse -Filter "$suite.trx" |
                Select-Object -First 1
            if ($null -eq $trxReport) {
              throw "$suite did not produce a TRX report."
            }

            [xml]$testResults = Get-Content $trxReport.FullName -Raw
            $counters = $testResults.TestRun.ResultSummary.Counters
            if ($null -eq $counters -or
                [int]$counters.total -le 0 -or
                [int]$counters.failed -ne 0 -or
                [int]$counters.executed -ne [int]$counters.total -or
                [int]$counters.passed -ne [int]$counters.total) {
              throw "$suite has failed, skipped, or not-executed tests."
            }

            $coverageReport = Get-ChildItem $resultRoot -Recurse -Filter *.cobertura.xml |
                Select-Object -First 1
            if ($null -eq $coverageReport) {
              throw "$suite did not produce a Cobertura report."
            }

            [xml]$coverage = Get-Content $coverageReport.FullName -Raw
            $linesValid = [int]$coverage.coverage.GetAttribute("lines-valid")
            if ($linesValid -eq 0) {
              throw "$suite coverage contains no owned production lines."
            }
            $unexpectedPackages = @(
              $coverage.coverage.packages.package |
                  ForEach-Object { $_.GetAttribute("name") } |
                  Where-Object { $_ -notin @("DiskInventoryZed", "DiskInventoryZed.Core", "DiskInventoryZed.Windows") }
            )
            if ($unexpectedPackages.Count -ne 0) {
              throw "$suite coverage contains unexpected packages: $($unexpectedPackages -join ', ')"
            }
            $requiredPackage = if ($suite -eq "Core") { "DiskInventoryZed.Core" } else { "DiskInventoryZed" }
            $requiredPackageNode = $coverage.coverage.packages.package |
                Where-Object { $_.GetAttribute("name") -eq $requiredPackage } |
                Select-Object -First 1
            if ($null -eq $requiredPackageNode) {
              throw "$suite coverage does not contain required package $requiredPackage."
            }

            $rawLineRate = [double]$requiredPackageNode.GetAttribute("line-rate")
            $rawBranchRate = [double]$requiredPackageNode.GetAttribute("branch-rate")
            if ([double]::IsNaN($rawLineRate) -or [double]::IsInfinity($rawLineRate) -or
                [double]::IsNaN($rawBranchRate) -or [double]::IsInfinity($rawBranchRate) -or
                $rawLineRate -lt 0 -or $rawLineRate -gt 1 -or
                $rawBranchRate -lt 0 -or $rawBranchRate -gt 1) {
              throw "$suite coverage contains invalid rates for $requiredPackage."
            }
            $lineRate = [math]::Round(100 * $rawLineRate, 1)
            $branchRate = [math]::Round(100 * $rawBranchRate, 1)
            if ($suite -eq "Core" -and ($rawLineRate -lt 0.65 -or $rawBranchRate -lt 0.60)) {
              throw "Core coverage regressed below 65% line / 60% branch: $lineRate% / $branchRate%."
            }
            if ($suite -eq "Windows" -and ($rawLineRate -lt 0.10 -or $rawBranchRate -lt 0.05)) {
              throw "Windows coverage regressed below 10% line / 5% branch: $lineRate% / $branchRate%."
            }
            $skipped = [int]$counters.total - [int]$counters.passed - [int]$counters.failed
            @(
              "### $suite tests ($env:RUNNER_ARCH)"
              ""
              "| Total | Passed | Failed | Skipped/not executed | Line coverage | Branch coverage |"
              "| ---: | ---: | ---: | ---: | ---: | ---: |"
              "| $($counters.total) | $($counters.passed) | $($counters.failed) | $skipped | $lineRate% | $branchRate% |"
              ""
            ) | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload Windows test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DiskInventoryZed-Windows-TestReports-${{ runner.arch }}
          path: artifacts/test-results/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Build Windows desktop application
        shell: pwsh
        run: dotnet build Windows/src/DiskInventoryZed.Windows/DiskInventoryZed.Windows.csproj -c Release --no-restore

      - name: Package x64 and ARM64 applications
        shell: pwsh
        run: |
          ./Windows/scripts/package.ps1 -Runtime win-x64
          ./Windows/scripts/package.ps1 -Runtime win-arm64
          $archives = @(Get-ChildItem artifacts/windows/*.zip)
          if ($archives.Count -ne 2) {
            throw "Expected exactly two Windows archives, found $($archives.Count)."
          }
          $archives | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content artifacts/windows/DiskInventoryZed-Windows-checksums.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DiskInventoryZed-Windows
          path: |
            artifacts/windows/*.zip
            artifacts/windows/DiskInventoryZed-Windows-checksums.txt
          if-no-files-found: error
          overwrite: true

  release:
    needs: [validate, build, windows]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DiskInventoryZed-DMG

      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DiskInventoryZed-Windows
          path: windows-release

      - name: Verify release artifacts
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 scripts/release_integrity.py verify-local --version "$VERSION"
          sha256sum --check --strict DiskInventoryZed-checksums.txt
          (cd windows-release && sha256sum --check --strict DiskInventoryZed-Windows-checksums.txt)

      - name: Create and verify draft release
        env:
          TAG_NAME: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          resolve_tag_commit() {
            local object_type object_sha
            read -r object_type object_sha <<< "$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" \
              --jq '.object.type + " " + .object.sha')"
            for _ in {1..5}; do
              if [ "$object_type" = "commit" ]; then
                printf '%s\n' "$object_sha"
                return 0
              fi
              if [ "$object_type" != "tag" ]; then
                echo "Unsupported release tag target type: $object_type" >&2
                return 1
              fi
              read -r object_type object_sha <<< "$(gh api \
                "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                --jq '.object.type + " " + .object.sha')"
            done
            echo "Release tag nesting exceeds the supported depth." >&2
            return 1
          }
          TAG_COMMIT="$(resolve_tag_commit)"
          if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "Release tag moved from validated commit $GITHUB_SHA to $TAG_COMMIT." >&2
            exit 1
          fi
          MARKER="<!-- disk-inventory-zed-workflow-run:$GITHUB_RUN_ID -->"
          RELEASE_JSON="$RUNNER_TEMP/disk-inventory-zed-release.json"
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          # shellcheck disable=SC2016
          gh api graphql \
            -f query='query($owner:String!, $name:String!, $tag:String!) { repository(owner:$owner, name:$name) { release(tagName:$tag) { databaseId isDraft isPrerelease description tagName } } }' \
            -f owner="$GITHUB_REPOSITORY_OWNER" \
            -f name="$REPOSITORY_NAME" \
            -f tag="$TAG_NAME" > "$RELEASE_JSON"
          RELEASE_STATE="$(python3 scripts/release_integrity.py classify-release \
            --json "$RELEASE_JSON" \
            --tag "$TAG_NAME" \
            --marker "$MARKER")"
          EXPECTED_RELEASE_ID=""
          if [ "$RELEASE_STATE" = "draft" ]; then
            EXPECTED_RELEASE_ID="$(python3 scripts/release_integrity.py uploaded-draft-id \
              --json "$RELEASE_JSON" \
              --tag "$TAG_NAME" \
              --marker "$MARKER")"
          fi
          ASSETS=(
            "DiskInventoryZed-$VERSION.dmg"
            DiskInventoryZed-checksums.txt
            "windows-release/DiskInventoryZed-Windows-v$VERSION-win-x64.zip"
            "windows-release/DiskInventoryZed-Windows-v$VERSION-win-arm64.zip"
            windows-release/DiskInventoryZed-Windows-checksums.txt
          )
          if [ "$RELEASE_STATE" = "draft" ]; then
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          elif [ "$RELEASE_STATE" = "missing" ]; then
            gh release create "$TAG_NAME" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --generate-notes \
              --notes "$MARKER" \
              --title "Disk Inventory Zed $VERSION"
          fi
          RELEASE_AFTER_UPLOAD="$RUNNER_TEMP/disk-inventory-zed-release-after-upload.json"
          # shellcheck disable=SC2016
          gh api graphql \
            -f query='query($owner:String!, $name:String!, $tag:String!) { repository(owner:$owner, name:$name) { release(tagName:$tag) { databaseId isDraft isPrerelease description tagName } } }' \
            -f owner="$GITHUB_REPOSITORY_OWNER" \
            -f name="$REPOSITORY_NAME" \
            -f tag="$TAG_NAME" > "$RELEASE_AFTER_UPLOAD"
          RELEASE_ID="$(python3 scripts/release_integrity.py uploaded-draft-id \
            --json "$RELEASE_AFTER_UPLOAD" \
            --tag "$TAG_NAME" \
            --marker "$MARKER")"
          test "$RELEASE_ID" -gt 0
          if [ -n "$EXPECTED_RELEASE_ID" ] && [ "$RELEASE_ID" != "$EXPECTED_RELEASE_ID" ]; then
            echo "The draft release identity changed during asset upload." >&2
            exit 1
          fi
          RELEASE_BEFORE_DOWNLOAD="$RUNNER_TEMP/disk-inventory-zed-release-before-download.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RELEASE_BEFORE_DOWNLOAD"
          mkdir release-download
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir release-download
          RELEASE_AFTER_DOWNLOAD="$RUNNER_TEMP/disk-inventory-zed-release-after-download.json"
          VERIFIED_RELEASE_STATE="$RUNNER_TEMP/disk-inventory-zed-verified-release-state.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RELEASE_AFTER_DOWNLOAD"
          python3 scripts/release_integrity.py verify-download \
            --version "$VERSION" \
            --download-dir release-download \
            --before-json "$RELEASE_BEFORE_DOWNLOAD" \
            --after-json "$RELEASE_AFTER_DOWNLOAD" \
            --tag "$TAG_NAME" \
            --marker "$MARKER" \
            --state-out "$VERIFIED_RELEASE_STATE"
          (cd release-download && sha256sum --check --strict DiskInventoryZed-checksums.txt)
          (cd release-download && sha256sum --check --strict DiskInventoryZed-Windows-checksums.txt)

      - name: Publish verified release
        env:
          TAG_NAME: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          resolve_tag_commit() {
            local object_type object_sha
            read -r object_type object_sha <<< "$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" \
              --jq '.object.type + " " + .object.sha')"
            for _ in {1..5}; do
              if [ "$object_type" = "commit" ]; then
                printf '%s\n' "$object_sha"
                return 0
              fi
              if [ "$object_type" != "tag" ]; then
                echo "Unsupported release tag target type: $object_type" >&2
                return 1
              fi
              read -r object_type object_sha <<< "$(gh api \
                "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                --jq '.object.type + " " + .object.sha')"
            done
            echo "Release tag nesting exceeds the supported depth." >&2
            return 1
          }
          TAG_COMMIT="$(resolve_tag_commit)"
          if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "Release tag moved from validated commit $GITHUB_SHA to $TAG_COMMIT." >&2
            exit 1
          fi
          MARKER="<!-- disk-inventory-zed-workflow-run:$GITHUB_RUN_ID -->"
          RELEASE_JSON="$RUNNER_TEMP/disk-inventory-zed-release-before-publish.json"
          VERIFIED_RELEASE_STATE="$RUNNER_TEMP/disk-inventory-zed-verified-release-state.json"
          RELEASE_ID="$(jq -r '.id' "$VERIFIED_RELEASE_STATE")"
          test "$RELEASE_ID" -gt 0
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RELEASE_JSON"
          python3 scripts/release_integrity.py verify-draft \
            --json "$RELEASE_JSON" \
            --state "$VERIFIED_RELEASE_STATE" \
            --version "$VERSION" \
            --tag "$TAG_NAME" \
            --marker "$MARKER"
          TAG_COMMIT="$(resolve_tag_commit)"
          if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "Release tag moved immediately before publication." >&2
            exit 1
          fi
          PUBLISHED_RELEASE="$RUNNER_TEMP/disk-inventory-zed-published-release.json"
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=legacy > "$PUBLISHED_RELEASE"
          python3 scripts/release_integrity.py verify-published \
            --json "$PUBLISHED_RELEASE" \
            --state "$VERIFIED_RELEASE_STATE" \
            --version "$VERSION" \
            --tag "$TAG_NAME" \
            --marker "$MARKER"
